:root{
  --g9:#003D24; --g8:#00562B; --g7:#0A6B3A; --g6:#1F7D45;
  --olive:#679124; --olive-l:#8DB04B;
  --sage:#C3D69B; --sage-l:#D7E4BD; --sage-xl:#E9F0D8; --cream:#FAFBF4;
  --gold:#D9A92B; --gold-l:#F3D57E; --gold-d:#8A6510;
  --ink:#16301F;
  --ar:'Cairo Variable',sans-serif;
  --kufi:'Noto Kufi Arabic Variable','Cairo Variable',sans-serif;
  --lat:'Cairo Variable',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#C9DAA4}
body{font-family:var(--lat);color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1}
[dir=rtl]{font-family:var(--ar)}

#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(1400px 700px at 50% -10%, #E6EED3 0%, var(--sage-l) 45%, #CBDCA6 100%)}
#pattern{position:absolute;inset:0;opacity:.11;pointer-events:none}

/* ---------- header ---------- */
header{position:absolute;left:20px;right:20px;top:0;height:126px;display:flex;align-items:center;justify-content:space-between}
header .logoL{height:100px;width:auto}
header .logoR{height:80px;width:auto}
.clockwrap{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center}
.clock{font-size:76px;line-height:1;font-weight:850;color:var(--g8);letter-spacing:1px}
.clock .sec{font-size:36px;font-weight:700;color:var(--olive);margin-left:6px;vertical-align:top;position:relative;top:6px}
.dates{margin-top:6px;font-size:25px;font-weight:650;color:var(--g7);white-space:nowrap;display:flex;gap:18px;justify-content:center;align-items:center}
.dates .dot{width:8px;height:8px;border-radius:50%;background:var(--olive)}

/* ---------- columns ---------- */
.col{position:absolute;top:136px;height:924px;border-radius:28px;overflow:hidden}
.colL{left:20px;width:540px;background:var(--cream);box-shadow:0 10px 30px rgba(0,61,36,.14)}
.colM{left:580px;width:780px;background:linear-gradient(170deg,var(--g7) 0%,var(--g8) 40%,var(--g9) 100%);box-shadow:0 14px 40px rgba(0,61,36,.32);color:#fff}
.colR{left:1380px;width:520px;background:var(--cream);box-shadow:0 10px 30px rgba(0,61,36,.14)}
.colhead{height:66px;background:var(--g8);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:29px;font-weight:750}
.colhead .ar{font-family:var(--kufi);font-size:27px;font-weight:700}

/* ---------- left: spotlight ---------- */
.spot{position:absolute;left:0;right:0;top:66px;bottom:58px}
.card{position:absolute;inset:0;padding:30px 34px 20px;display:flex;flex-direction:column}
.card[dir=rtl]{text-align:right}
.icon{width:92px;height:92px;border-radius:26px;background:var(--olive);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(103,145,36,.35)}
.card[dir=rtl] .icon{margin-left:auto}
.icon svg{width:56px;height:56px}
.ctitle{margin-top:20px;font-size:41px;line-height:1.2;font-weight:850;color:var(--g8)}
.card[dir=rtl] .ctitle{font-family:var(--kufi);font-size:37px;line-height:1.45;font-weight:750}
.kicker{margin-top:22px;font-size:21px;font-weight:850;letter-spacing:2px;text-transform:uppercase;color:var(--olive)}
.kicker+.ctitle{margin-top:2px}
.cbody{margin-top:14px;font-size:29px;line-height:1.45;color:var(--ink);font-weight:550}
.card[dir=rtl] .cbody{font-size:31px;line-height:1.6}
.cbody li{list-style:none;position:relative;padding-left:26px;margin-bottom:4px}
.card[dir=rtl] .cbody li{padding-left:0;padding-right:26px}
.cbody li::before{content:"";position:absolute;left:2px;top:.62em;width:11px;height:11px;border-radius:3px;background:var(--olive);transform:rotate(45deg)}
.card[dir=rtl] .cbody li::before{left:auto;right:2px}
.cbody .strong{font-weight:800;color:var(--g8)}
.cbody li.plain{padding-left:0!important;padding-right:0!important}
.cbody li.plain::before{display:none}
.cbody .warm{font-weight:800;color:var(--olive);margin-top:12px}
.cbody .lead{font-weight:800;color:var(--g8)}
.card[dir=rtl] .cbody .lead{font-size:28px;white-space:nowrap}
.card[dir=rtl] .cbody .small{font-size:26px;line-height:1.65;margin-top:6px}
.contact{margin-top:auto;display:flex;align-items:center;gap:22px;padding-top:18px;border-top:2px dashed rgba(0,86,43,.25)}
.card[dir=rtl] .contact{flex-direction:row-reverse}
.contact .qr{width:150px;height:150px;flex:none;background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.contact .qr svg{width:100%;height:100%;display:block}
.contact .ctext{flex:1}
.card[dir=rtl] .contact .ctext{text-align:right}
.contact .lab{font-size:23px;font-weight:750;color:var(--olive)}
.contact .phone{font-size:44px;line-height:1.1;font-weight:850;color:var(--g8);direction:ltr;unicode-bidi:isolate;white-space:nowrap;display:inline-block}
.contact .scan{font-size:20px;font-weight:650;color:#5b6d52;margin-top:4px}
.progress{position:absolute;left:34px;right:34px;bottom:24px;height:10px;display:flex;gap:10px}
.progress i{flex:1;border-radius:6px;background:rgba(0,86,43,.15);overflow:hidden;position:relative}
.progress i b{position:absolute;left:0;top:0;bottom:0;background:var(--olive);border-radius:6px}

/* ---------- middle: today ---------- */
.mwrap{position:absolute;inset:0;padding:20px 24px 22px}
.dayhead{display:flex;justify-content:space-between;align-items:center;height:56px}
.dayhead .de{font-size:38px;font-weight:850;letter-spacing:.5px}
.dayhead .de small{font-size:24px;font-weight:700;color:var(--gold-l);letter-spacing:2px;text-transform:uppercase;margin-right:12px;vertical-align:middle}
.dayhead .ar{font-family:var(--kufi);font-size:36px;font-weight:750}
.dayhead .ar small{font-family:var(--ar);font-size:25px;font-weight:700;color:var(--gold-l);margin-left:12px}
.prayers{margin-top:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pt{height:146px;border-radius:18px;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.pt .an{font-family:var(--kufi);font-size:23px;font-weight:700;color:var(--sage-l);line-height:1.3}
.pt .dn{font-size:18px;font-weight:650;color:rgba(255,255,255,.62);line-height:1.1;margin-top:-2px}
.pt .tm{font-size:41px;font-weight:850;line-height:1.15;margin-top:4px}
.pt .iq{font-size:18px;font-weight:750;color:var(--sage);margin-top:1px}
.pt.past{opacity:.5}
.pt.sun .tm{font-size:36px;color:var(--sage-l)}
.pt.next{background:linear-gradient(180deg,var(--gold-l),var(--gold));border-color:#FFF1C2;color:var(--ink)}
.pt.next.sun .tm{color:var(--ink)}
.pt.next .an{color:var(--g9)} .pt.next .dn{color:rgba(22,48,31,.7)} .pt.next .iq{color:var(--gold-d)}
.nextbar{margin-top:10px;height:62px;border-radius:18px;background:rgba(0,0,0,.20);border:2px solid rgba(243,213,126,.45);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.nextbar .de{font-size:25px;font-weight:700;color:var(--sage-l)}
.nextbar .de b{color:#fff;font-weight:850}
.nextbar .cd{font-size:44px;font-weight:850;color:var(--gold-l);letter-spacing:1px}
.nextbar .ar{font-size:26px;font-weight:700;color:var(--sage-l)}
.nextbar .ar b{color:#fff;font-weight:850;font-family:var(--kufi);font-size:24px}
.nextbar.iqama{background:linear-gradient(180deg,var(--gold-l),var(--gold));border-color:#FFF1C2}
.nextbar.iqama .de,.nextbar.iqama .ar{color:var(--g8)}
.nextbar.iqama .de b,.nextbar.iqama .ar b,.nextbar.iqama .cd{color:var(--g9)}
.ptnote{margin-top:4px;text-align:right;font-size:16px;font-weight:600;color:rgba(255,255,255,.5);height:20px}
.proghead{margin-top:4px;display:flex;align-items:center;gap:16px;font-size:26px;font-weight:800;color:var(--gold-l)}
.proghead .line{flex:1;height:2px;background:linear-gradient(90deg,rgba(243,213,126,.6),rgba(243,213,126,.1))}
.proghead .ar{font-family:var(--kufi);font-size:24px;font-weight:700}
.items{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.it{position:relative;display:flex;align-items:center;gap:18px;padding:12px 18px;border-radius:18px;background:rgba(255,255,255,.075);border:2px solid transparent;min-height:92px}
.it .chip{flex:none;width:186px;text-align:center;border-radius:12px;background:rgba(255,255,255,.12);padding:6px 4px;font-size:27px;font-weight:800;line-height:1.2;direction:ltr}
.it .chip.arc{direction:rtl;font-family:var(--ar);font-size:24px}
.it .chip .two{display:block;font-size:24px}
.it .txt{flex:1;min-width:0}
.it .t{font-size:30px;font-weight:800;line-height:1.25}
.it[dir=rtl] .t{font-size:31px;line-height:1.4}
.it .s{font-size:21px;font-weight:600;color:var(--sage);line-height:1.3;margin-top:2px}
.it[dir=rtl] .s{font-size:23px;line-height:1.5}
.it[dir=rtl] .s.gloss{direction:ltr;text-align:right;font-family:var(--lat)}
.it.past{opacity:.4;min-height:0;padding:6px 18px}
.it.past .t{font-size:24px!important;line-height:1.3!important}
.it.past .s{display:none}
.it.past .chip{font-size:21px;width:auto;min-width:186px;padding:3px 10px}
.it.past .chip .two{display:inline;font-size:21px}
.it.past .chip .two+.two::before{content:" · "}
#items.dense .it{min-height:70px;padding:8px 16px}
#items.dense .it .t{font-size:27px}
#items.dense .it[dir=rtl] .t{font-size:28px}
#items.dense .it .s{font-size:19px}
#items.dense{gap:8px}
#items.dense .it:not(.now):not(.next) .s{display:none}
#items.tight .it:not(.now) .s{display:none}
#items.min .it .s{display:none}
.it.now{background:var(--cream);color:var(--ink);border-color:#fff}
.it.now .chip{background:var(--gold);color:var(--ink)}
.it.now .s{color:var(--olive)}
.it.next{border-color:rgba(243,213,126,.55)}
.badge{position:absolute;top:-13px;font-size:16px;font-weight:850;letter-spacing:1.5px;padding:2px 12px;border-radius:20px;white-space:nowrap}
.it[dir=ltr] .badge{right:16px} .it[dir=rtl] .badge{left:16px}
.badge.now{background:var(--gold);color:var(--ink)}
.badge.next{background:var(--g9);color:var(--gold-l);border:2px solid rgba(243,213,126,.6)}

/* ---------- right: week roll ---------- */
.viewport{position:absolute;left:0;right:0;top:66px;bottom:70px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 70px),transparent 100%)}
.roll{position:absolute;left:0;right:0;top:0;padding:16px 20px 0;will-change:transform}
.day{padding:14px 16px 16px;margin-bottom:18px;border-radius:20px;background:#fff;box-shadow:0 2px 10px rgba(0,61,36,.07);border:2px solid var(--sage-xl)}
.dh{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:10px;border-bottom:2px solid var(--sage-xl)}
.dh .de{font-size:30px;font-weight:850;color:var(--g8);display:flex;align-items:center;gap:10px}
.dh .de svg{width:26px;height:26px}
.dh .ar{font-family:var(--kufi);font-size:29px;font-weight:750;color:var(--g8)}
.dh .tag{font-size:17px;font-weight:850;letter-spacing:1px;background:var(--gold);color:var(--ink);border-radius:14px;padding:1px 10px;margin-left:6px}
.ri{display:flex;align-items:flex-start;gap:12px;padding:6px 0}
.ri + .ri{border-top:1px solid #EEF2E4}
.ri .chip .two{display:block}
.ri .chip{flex:none;width:142px;text-align:center;border-radius:10px;background:var(--sage-xl);color:var(--g8);font-size:22px;font-weight:800;line-height:1.25;padding:5px 2px;direction:ltr}
.ri .chip.arc{direction:rtl;font-family:var(--ar);font-size:20px;line-height:1.3}
.ri .chip.todo{background:#F6EFD8;color:var(--gold-d)}
.ri .txt{flex:1;min-width:0}
.ri .t{font-size:24px;font-weight:800;line-height:1.3;color:var(--ink)}
.ri[dir=rtl] .t{font-size:25px;line-height:1.45}
.ri .s{font-size:18px;font-weight:600;color:#5E7154;line-height:1.3}
.ri[dir=rtl] .s{font-size:19px;line-height:1.55}
.ri[dir=rtl] .s.gloss{direction:ltr;text-align:right;font-family:var(--lat)}
.strip{position:absolute;left:20px;right:20px;bottom:18px;height:38px;display:flex;gap:8px}
.strip span{flex:1;border-radius:12px;background:var(--sage-xl);color:var(--g7);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
.strip span.on{background:var(--g8);color:#fff}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* v2: description runs under chip + title, full card width */
.it{display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:0;align-items:center;align-content:center}
.it .chip{min-width:186px;width:auto;grid-column:1;grid-row:1}
.it .txt,.ri .txt{display:contents}
.it .t{grid-column:2;grid-row:1}
.it .s{grid-column:1 / -1;grid-row:2;margin-top:6px}
.ri{display:grid;grid-template-columns:142px 1fr;column-gap:12px;row-gap:0;align-items:center;align-content:start}
.ri .chip{grid-column:1;grid-row:1}
.ri .t{grid-column:2;grid-row:1}
.ri .s{grid-column:1 / -1;grid-row:2;margin-top:2px}
.card[dir=rtl] .cbody .warm{font-size:27px;line-height:1.6}
</style>
</head>
<body>
<div id="stage">
  <svg id="pattern" width="1920" height="1080"><defs>
    <pattern id="leaf" width="180" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <g fill="#3F6E12">
        <ellipse cx="40" cy="40" rx="22" ry="7" transform="rotate(35 40 40)"/>
        <ellipse cx="62" cy="30" rx="18" ry="6" transform="rotate(-25 62 30)"/>
        <ellipse cx="130" cy="120" rx="22" ry="7" transform="rotate(-40 130 120)"/>
        <ellipse cx="108" cy="132" rx="16" ry="5.5" transform="rotate(20 108 132)"/>
        <circle cx="150" cy="40" r="5" fill="#00562B"/>
      </g>
    </pattern></defs>
    <rect width="1920" height="1080" fill="url(#leaf)"/>

/* ===================== PRAYER TIMES =====================
   1st choice: prayer-times.json – the mosque's MAWAQIT year calendar, fetched every night by fetch_mawaqit.py
   2nd choice: the last good copy saved in this browser (works offline)
   3rd choice: calculated with a formula (never an empty screen)                                          */
const TIMES_URL = Q.get('times') || 'prayer-times.json';
const P_KEYS = ['fajr','sunrise','dhuhr','asr','maghrib','isha'], IQ_KEYS = ['fajr','dhuhr','asr','maghrib','isha'];
let MQ = null, MQ_STATE = 'none';                       // 'live' | 'cached' | 'none'
const hm = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s ?? '').trim()); return m ? (+m[1])*60 + (+m[2]) : null; };
const validMQ = j => !!j && Array.isArray(j.calendar) && j.calendar.length === 12;

async function loadMawaqit(){
  if (RENDER && !Q.get('times')) return;                // the video uses sample times
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(TIMES_URL + (TIMES_URL.includes('?') ? '&' : '?') + 'v=' + Date.now(), {cache:'no-store', signal:ctl.signal});
    clearTimeout(to);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!validMQ(j)) throw new Error('invalid data');
    MQ = j; MQ_STATE = 'live';
    try { localStorage.setItem('seituna-mawaqit', JSON.stringify(j)); } catch(e) {}
  } catch(e) {
    console.warn('MAWAQIT data not loaded:', e.message);
    if (MQ) { MQ_STATE = 'cached'; return; }
    try { const c = JSON.parse(localStorage.getItem('seituna-mawaqit')); if (validMQ(c)) { MQ = c; MQ_STATE = 'cached'; } } catch(e2) {}
  }
}
function mqDay(date){                                   // one day of the MAWAQIT calendar, or null
  if (!MQ) return null;
  const m = date.getMonth(), d = String(date.getDate());
  const row = MQ.calendar[m] && MQ.calendar[m][d];
  if (!Array.isArray(row) || (row.length !== 6 && row.length !== 7)) return null;
  const t = row.length === 7 ? row.slice(1) : row;     // 7 times = Imsak first
  const o = {src:'mawaqit', iq:{}, iqs:{}};
  for (let i = 0; i < 6; i++){ const v = hm(t[i]); if (v == null) return null; o[P_KEYS[i]] = v; }
  const iq = MQ.iqamaEnabled !== false && MQ.iqamaCalendar && MQ.iqamaCalendar[m] ? MQ.iqamaCalendar[m][d] : null;
  if (Array.isArray(iq) && iq.length === 5) IQ_KEYS.forEach((k,i) => {
    const raw = String(iq[i] ?? '').trim();
    if (/^\+?\d{1,3}$/.test(raw)) { o.iq[k] = o[k] + parseInt(raw,10); o.iqs[k] = '+' + parseInt(raw,10); }
    else { const v = hm(raw); if (v != null && v >= o[k]) { o.iq[k] = v; o.iqs[k] = raw; } }
  });
  if (date.getDay() === 5) o.jumua = [MQ.jumuaAsDuhr ? t[2] : MQ.jumua, MQ.jumua2, MQ.jumua3].map(hm).filter(v => v != null);
  return o;
}
function calcDay(date){                                 // fallback: formula (or fixed samples in the video)
  const o = {src: RENDER ? 'sample' : 'calc', iq:{}, iqs:{}};
  if (RENDER || typeof adhan === 'undefined') { for (const k in SAMPLE_TIMES) o[k] = toMin(SAMPLE_TIMES[k]); return o; }
  const pt = new adhan.PrayerTimes(new adhan.Coordinates(52.5169,13.2830), date, adhan.CalculationMethod.MuslimWorldLeague());
  for (const k of P_KEYS) o[k] = pt[k].getHours()*60 + pt[k].getMinutes();
  return o;
}
function prayerTimes(date){
  const o = mqDay(date) || calcDay(date);
  IQ_KEYS.forEach(k => { if (o.iq[k] == null) { const off = PRAYERS.find(p => p[0] === k)[3];
    o.iq[k] = o[k] + off; o.iqs[k] = o.src === 'mawaqit' ? '' : '+' + off; } });   // guessed iqama is only shown on fallback
  if (o.jumua && o.jumua.length) { o.dhuhrAdhan = o.dhuhr; o.dhuhr = o.jumua[0]; }  // Friday: count down to Jumu'a
  const tm = new Date(date); tm.setDate(tm.getDate() + 1);
  o.fajrNext = (mqDay(tm) || calcDay(tm)).fajr;
  return o;
}
const PNAME = k => (k === 'dhuhr' && PT.jumua && PT.jumua.length) ? ['الجمعة','Jumu’a'] : PRAYERS.find(p => p[0] === k).slice(1,3);
function sourceNote(){
  if (PT.src === 'mawaqit') {
    const d = MQ.fetchedAt ? new Date(MQ.fetchedAt) : null;
    const when = d && !isNaN(d) ? ' · Stand ' + d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}) + ', ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : '';
    return (MQ_STATE === 'live' ? 'Gebetszeiten: MAWAQIT' : 'Gebetszeiten: MAWAQIT (gespeichert, offline)') + when;
  }
  return PT.src === 'sample' ? 'Beispielzeiten im Entwurf · später live aus MAWAQIT' : 'Gebetszeiten berechnet – MAWAQIT-Daten nicht erreichbar';
}

function chipHTML(it, isRight){
  if (it.todo) return `<div class="chip arc todo">الوقت يُعلن لاحقاً</div>`;
  if (it.after) return `<div class="chip arc">بعد صلاة ${PRAYERS.find(p=>p[0]===it.after)[1]}</div>`;
  if (it.at) return `<div class="chip num">${it.at}</div>`;

  return `<div class="chip num">${it.slots[0].join('–')}</div>`;
}
function subHTML(it){
  if (it.gloss) return `<div class="s gloss">${it.gloss}</div>`;
  if (it.d) return `<div class="s">${it.d}</div>`;
  if (it.s) return `<div class="s">${it.s}</div>`;
  return '';
}
function itemRange(it){ // minutes [start,end] for now/next logic
  if (it.todo) return null;
  if (it.after){ const p = PT.iq[it.after] + 5; return [p, p+(it.dur||60)]; }   // ~5 min after the iqama
  if (it.at){ const m = toMin(it.at); return [m, m+(it.dur||45)]; }

}

  // infos
  document.getElementById('spot').innerHTML = INFOS.map((c,i)=>
    `<div class="card" dir="${c.dir}" data-i="${i}"><div class="icon">${ICONS[c.icon]}</div>${c.kicker?`<div class="kicker">${c.kicker}</div>`:''}<div class="ctitle">${c.title}</div><ul class="cbody">${c.body.map(b=>b.startsWith('<')?b:`<li>${b}</li>`).join('')}</ul>
     <div class="contact"><div class="qr">${c.qr}</div><div class="ctext"><div class="lab">${c.lab}</div><div class="phone num">${c.phone}</div><div class="scan">${c.scan}</div></div></div></div>`).join('');
  document.getElementById('prog').innerHTML = INFOS.map(()=>'<i><b></b></i>').join('');
}

/* ===================== RENDER ONE MOMENT ===================== */
let OFFS = null;
function measure(){   // roll stops: top of each day; a day taller than the window gets a 2nd stop at its bottom
  const cards = [...document.querySelectorAll('#roll .day')], K = cards.length/2;
  const vis = document.querySelector('.viewport').clientHeight - 84;
  const top = c => c.offsetTop - cards[0].offsetTop;
  OFFS = [];
  for (let i=0;i<K;i++){ OFFS.push({y:top(cards[i]), day:i});
    if (cards[i].offsetHeight > vis) OFFS.push({y:top(cards[i]) + cards[i].offsetHeight - vis, day:i}); }
  OFFS.endY = top(cards[K]);
}
function render(t, now){
  if (!OFFS) measure();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;

  // clock
  document.getElementById('hm').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  document.getElementById('ss').textContent = pad(now.getSeconds());

  // prayers: past / next + countdown
  // three phases:  adhan → iqama   |   after Fajr's iqama → Shuruq   |   otherwise → next adhan
  const keys = ['fajr','dhuhr','asr','maghrib','isha'];
  let ph = null;
  for (const k of keys) {
    if (k === 'dhuhr' && PT.jumua && PT.jumua.length) continue;            // Jumu'a: no iqama countdown
    if (nowMin >= PT[k] && nowMin < PT.iq[k]) { ph = {mode:'iqama', k, target:PT.iq[k]}; break; }
  }
  if (!ph && nowMin >= PT.iq.fajr && nowMin < PT.sunrise) ph = {mode:'shuruq', k:'sunrise', target:PT.sunrise};
  if (!ph) { const k = keys.find(k => PT[k] > nowMin);
    ph = k ? {mode:'next', k, target:PT[k]} : {mode:'next', k:'fajr', target:PT.fajrNext + 1440}; }   // after Isha: tomorrow's Fajr
  document.querySelectorAll('.pt').forEach(el => {
    const k = el.dataset.k;
    el.classList.toggle('next', k === ph.k);
    el.classList.toggle('past', k !== ph.k && PT[k] <= nowMin);
  });
  const secs = Math.max(0, Math.ceil((ph.target - nowMin)*60 - 1e-6));
  const hh = Math.floor(secs/3600), mmss = pad(Math.floor(secs/60)%60) + ':' + pad(secs%60);
  document.getElementById('cd').textContent = hh ? pad(hh) + ':' + mmss : mmss;          // under 1 h: MM:SS
  const psig = ph.mode + ph.k;
  if (psig !== render.psig) { render.psig = psig;                                        // labels only change with the phase
    const [nAr, nDe] = PNAME(ph.k);
    const L = { next:   [`Nächstes Gebet: <b>${nDe}</b>`, `<b>${nAr}</b> بعد`],
                iqama:  [`Iqama <b>${nDe}</b> in`,        `إقامة <b>${nAr}</b> بعد`],
                shuruq: [`<b>Schurūq</b> in`,             `<b>الشروق</b> بعد`] }[ph.mode];
    document.getElementById('nbDe').innerHTML = L[0];
    document.getElementById('nbAr').innerHTML = L[1];
    document.querySelector('.nextbar').classList.toggle('iqama', ph.mode === 'iqama'); }
  const pulse = .5 + .5*Math.sin(t*2*Math.PI/2.4);
  document.querySelector('.nextbar').style.boxShadow = ph.mode === 'iqama' ? `0 0 ${14+16*pulse}px rgba(243,213,126,${.3+.4*pulse})` : 'none';
  const nt = document.querySelector('.pt.next');
  if (nt) nt.style.boxShadow = `0 0 ${18+18*pulse}px rgba(243,213,126,${.35+.35*pulse})`;

  // today items: past / now / next
  let nextSet = false;
  const els = [...document.querySelectorAll('#items .it')];
  const st = els.map(el => { const r = itemRange(TODAY_ITEMS[+el.dataset.i]); if (!r) return '';
    if (nowMin >= r[1]) return 'past'; if (nowMin >= r[0]) return 'now'; if (!nextSet) { nextSet = true; return 'next'; } return ''; });
  const sig = st.join('|');
  if (sig !== render.sig){ render.sig = sig;                 // only when a class starts or ends
    els.forEach((el,i) => { el.classList.remove('past','now','next'); el.querySelector('.badge')?.remove(); el.style.boxShadow = 'none';
      if (st[i]) el.classList.add(st[i]);
      if (st[i] === 'now') el.insertAdjacentHTML('beforeend','<span class="badge now">JETZT · الآن</span>');
      if (st[i] === 'next') el.insertAdjacentHTML('beforeend','<span class="badge next">DANACH · التالي</span>'); });
    // auto-fit: drop descriptions step by step until today's list fits
    const box = document.getElementById('items'), wrap = document.querySelector('.mwrap');
    box.classList.remove('dense','tight','min');
    const over = () => box.getBoundingClientRect().bottom > wrap.getBoundingClientRect().bottom - 30;   // keep ~8 px air above the card edge
    for (const lv of ['dense','tight','min']) if (over()) box.classList.add(lv); }
  els.forEach((el,i) => { if (st[i] === 'now') el.style.boxShadow = `0 0 ${10+16*pulse}px rgba(243,213,126,${.25+.4*pulse})`; });

  // left: rotating infos
  const N = INFOS.length, n = Math.floor(t/INFO_PERIOD), idx = n % N, local = t - n*INFO_PERIOD;
  const p = (n===0) ? 1 : clamp01(local/INFO_TRANS), prev = (idx-1+N)%N;
  const pin = ease(clamp01((p-.45)/.55)), pout = ease(clamp01(p/.45));   // out first, then in – no overlap
  document.querySelectorAll('#spot .card').forEach((el,i) => {
    let o=0, x=0;
    if (i===idx){ o=pin; x=50*(1-pin); }
    else if (i===prev && p<1){ o=1-pout; x=-50*pout; }
    el.style.opacity = o; el.style.transform = `translateX(${x}px)`; el.style.visibility = o>0?'visible':'hidden';
  });
  document.querySelectorAll('#prog b').forEach((b,i) => { b.style.width = (i<idx?100: i===idx? 100*clamp01(local/INFO_PERIOD) : 0)+'%'; });

  // right: step roll
  const S = OFFS.length, k = Math.floor(t/ROLL_STEP), lk = t - k*ROLL_STEP, j = k % S;
  const m = ease((lk-(ROLL_STEP-ROLL_MOVE))/ROLL_MOVE);
  const a = OFFS[j].y, b = j+1 < S ? OFFS[j+1].y : OFFS.endY;
  document.getElementById('roll').style.transform = `translateY(${-(a+(b-a)*m)}px)`;
  const active = m > .5 ? (j+1 < S ? OFFS[j+1].day : 0) : OFFS[j].day;
  document.querySelectorAll('#strip span').forEach((s,i)=>s.classList.toggle('on', i===active));

  // video fade in/out
  if (RENDER){ const f = t<0.6 ? 1-t/0.6 : t>DURATION-0.8 ? (t-(DURATION-0.8))/0.8 : 0; document.getElementById('fade').style.opacity = clamp01(f); }
}

/* ===================== START ===================== */
function fitStage(){   // any screen size: scale the 1920×1080 design to fit, centred
  const s = Math.min(innerWidth/1920, innerHeight/1080), st = document.getElementById('stage');
  st.style.transform = `translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;
}
addEventListener('resize', fitStage); fitStage();
window.__ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(()=>{})));
  await loadMawaqit();
  build(RENDER ? SIM_START : new Date());
  await document.fonts.ready;
  measure();
  window.renderAt = t => render(t, new Date(SIM_START.getTime() + t*1000));
  if (RENDER) { window.renderAt(+Q.get('t')||0); }
  else {
    const t0 = performance.now();
    let lastDay = new Date().getDay();
    const loop = () => {
      const now = new Date();
      if (now.getDay() !== lastDay) { lastDay = now.getDay(); build(now); OFFS=null; }   // new day: rebuild
      render((performance.now()-t0)/1000, now);
      requestAnimationFrame(loop);
    };
    loop();
    setInterval(async () => { await loadMawaqit(); build(new Date()); OFFS = null; }, 3*60*60*1000);   // re-read the times every 3 h (no page reload: that would fail offline)
  }
  return true;
})();
</script>
